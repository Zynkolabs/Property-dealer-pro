name: Build Property Dealer Pro All-in-One ZK-ONE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'build-assets/pdp-allinone-20261024.gz.b64.part*'
      - 'android-app/**'
      - '.github/workflows/build-allinone-zk-one-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct exact premium app source and add mobile scroll fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/assets
          cat build-assets/pdp-allinone-20261024.gz.b64.part* | base64 -d | gzip -dc > android-app/app/src/main/assets/index.html
          ACTUAL=$(sha256sum android-app/app/src/main/assets/index.html | awk '{print $1}')
          EXPECTED='221b3c1042d44bc07cd65a90ea7a164b1df7159f74d41833a1b750d289eb98c0'
          echo "Source SHA256 before patch: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          grep -q "APP='property_dealer_pro'" android-app/app/src/main/assets/index.html
          grep -q 'ZK-ONE' android-app/app/src/main/assets/index.html
          grep -q 'pkrWords' android-app/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          patch = r'''
<style id="zynko-mobile-scroll-fix">
html,body{
  min-height:100% !important;
  height:auto !important;
  overflow-x:hidden !important;
  overflow-y:auto !important;
  -webkit-overflow-scrolling:touch !important;
  overscroll-behavior-y:auto !important;
}
body{
  position:relative !important;
  touch-action:pan-y pinch-zoom !important;
  padding-bottom:calc(96px + env(safe-area-inset-bottom)) !important;
}
main,.app,.app-shell,.page,.screen,.view,.content,.main-content,.workspace,.panel,.form-wrap{
  height:auto !important;
  min-height:0 !important;
  max-height:none !important;
}
.modal,.modal-content,.sheet,.sheet-content,.dialog,[role="dialog"],.form-modal,.drawer,.popup,.overlay-content{
  overflow-y:auto !important;
  -webkit-overflow-scrolling:touch !important;
  overscroll-behavior:contain !important;
  touch-action:pan-y !important;
  max-height:calc(100dvh - 12px) !important;
  padding-bottom:calc(120px + env(safe-area-inset-bottom)) !important;
}
form{
  overflow:visible !important;
  max-height:none !important;
}
@media (max-width:768px){
  html,body{width:100% !important;}
  .modal,.modal-content,.sheet,.sheet-content,.dialog,[role="dialog"],.form-modal,.drawer,.popup,.overlay-content{
    max-height:calc(100dvh - 4px) !important;
  }
}
</style>
'''
          if 'id="zynko-mobile-scroll-fix"' not in s:
              if '</head>' in s:
                  s = s.replace('</head>', patch + '\n</head>', 1)
              else:
                  s = patch + s
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'zynko-mobile-scroll-fix' android-app/app/src/main/assets/index.html

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android-app/zynko-property-release.jks.b64 > android-app/zynko-property-release.jks
          test "$(sha256sum android-app/zynko-property-release.jks | awk '{print $1}')" = 'a803c620829a6c9c3df1fe1195b99195994876fe4092ebd864c3a5dfb3465e88'

      - name: Build signed release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK='android-app/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.zynkolabs.propertydealerpro'"
          mkdir -p release-package
          cp "$APK" release-package/Property_Dealer_Pro_AllInOne_ZK_ONE_v2_1_SCROLL_FIXED.apk
          sha256sum release-package/Property_Dealer_Pro_AllInOne_ZK_ONE_v2_1_SCROLL_FIXED.apk > release-package/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Property-Dealer-Pro-AllInOne-ZK-ONE-v2.1-Scroll-Fixed-APK
          path: release-package/
          if-no-files-found: error
