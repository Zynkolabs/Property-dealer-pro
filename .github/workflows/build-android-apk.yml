name: Build Property Dealer Pro Release Package

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare release signing package
        shell: bash
        run: |
          mkdir -p release-package/signing-tools/lib
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk release-package/Property-Dealer-Pro-v1.0-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" release-package/signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-package/signing-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-package/signing-tools/zipalign
          chmod +x release-package/signing-tools/apksigner release-package/signing-tools/zipalign

      - name: Upload unsigned release and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Property-Dealer-Pro-Release-Unsigned
          path: release-package/
          if-no-files-found: error
