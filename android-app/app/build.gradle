plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zynkolabs.propertydealerpro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zynkolabs.propertydealerpro'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.3.0'
    }

    signingConfigs {
        release {
            storeFile file('../zynko-property-release.jks')
            storePassword 'ZynkoPDP2026'
            keyAlias 'zynko_property'
            keyPassword 'ZynkoPDP2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
