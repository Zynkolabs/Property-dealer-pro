<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>BoloBill</title><body style="margin:0;background:#10251f;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh"><b id="m">Opening BoloBill Deep AI…</b><script>(async()=>{try{let n=['b0.txt','b1.txt','b2.txt','b3.txt','b4a.txt','b4b.txt'],a=[];for(let f of n){let r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Could not load '+f);a.push(await r.text())}let u=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));let h=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();let patches='<scr'+'ipt src="v3patch.js?v=3"></scr'+'ipt><scr'+'ipt src="v4mic.js?v=4"></scr'+'ipt>';h=h.replace('</body>',patches+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.style.display='grid';document.body.style.placeItems='center';document.body.innerHTML='<div style="padding:24px;text-align:center"><b>BoloBill could not open.</b><br><small>'+String(e.message||e)+'</small></div>'}})()</script>
