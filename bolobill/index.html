<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>BoloBill</title><body style="margin:0;background:#10251f;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh"><b id="m">Opening BoloBill…</b><script>(async()=>{try{let n=['b0.txt','b1.txt','b2.txt','b3.txt','b4a.txt','b4b.txt'],a=[];for(let f of n)a.push(await(await fetch(f,{cache:'no-store'})).text());let u=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));let h=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()}catch(e){m.textContent='Open in updated Chrome: '+e.message}})()</script>
